<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8" />
    <title>Image App - OpenStack Lab</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
        }
        h1 {
            margin-bottom: 0.5rem;
        }
        .buttons {
            display: flex;
            gap: 0.5rem;
            margin: 1rem 0;
        }
        button {
            padding: 0.5rem 1rem;
            border-radius: 6px;
            border: 1px solid #ccc;
            cursor: pointer;
            background: #f5f5f5;
        }
        button:hover {
            background: #e5e5e5;
        }
        #image-select {
            min-width: 250px;
        }
        #output img {
            max-width: 400px;
            display: block;
            margin-top: 1rem;
        }
        #status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Image App</h1>
    <p>Aplicação web distribuída: consome uma API pública de imagens e salva os dados no banco.</p>

    <div class="buttons">
        <button id="btn-upload">Upload</button>
        <button id="btn-list">Listar</button>
        <button id="btn-show">Mostrar</button>
    </div>

    <div>
        <label for="image-select">Imagens cadastradas (por tag):</label>
        <select id="image-select">
            <!-- opções preenchidas via JS -->
        </select>
    </div>

    <div id="status"></div>

    <div id="output"></div>

    <script>
        const statusEl = document.getElementById("status");
        const selectEl = document.getElementById("image-select");
        const outputEl = document.getElementById("output");

        function setStatus(msg) {
            statusEl.textContent = msg || "";
        }

        async function uploadImage() {
            setStatus("Buscando imagem na API pública e salvando no banco...");
            try {
                const resp = await fetch("/api/upload", { method: "POST" });
                if (!resp.ok) throw new Error("Erro HTTP " + resp.status);
                const data = await resp.json();
                setStatus(`Imagem salva (id=${data.id}, tag="${data.tag}")`);
                await loadTags();
            } catch (err) {
                console.error(err);
                setStatus("Erro ao fazer upload da imagem.");
            }
        }

        async function loadTags() {
            setStatus("Carregando imagens salvas...");
            try {
                const resp = await fetch("/api/images");
                if (!resp.ok) throw new Error("Erro HTTP " + resp.status);
                const data = await resp.json();
                selectEl.innerHTML = "";
                data.forEach(img => {
                    const opt = document.createElement("option");
                    opt.value = img.id;
                    opt.textContent = `${img.tag} (id=${img.id})`;
                    selectEl.appendChild(opt);
                });
                setStatus(`Total de imagens salvas: ${data.length}`);
            } catch (err) {
                console.error(err);
                setStatus("Erro ao listar imagens.");
            }
        }

        async function showImage() {
            const id = selectEl.value;
            if (!id) {
                setStatus("Selecione uma imagem na lista.");
                return;
            }
            setStatus(`Carregando imagem id=${id}...`);
            try {
                const resp = await fetch(`/api/images/${id}`);
                if (!resp.ok) throw new Error("Erro HTTP " + resp.status);
                const data = await resp.json();
                outputEl.innerHTML = "";
                const img = document.createElement("img");
                img.src = data.url;
                img.alt = data.tag;
                outputEl.appendChild(img);

                const p = document.createElement("p");
                p.textContent = `Tag: ${data.tag}`;
                outputEl.appendChild(p);

                setStatus("Imagem carregada.");
            } catch (err) {
                console.error(err);
                setStatus("Erro ao carregar imagem.");
            }
        }

        document.getElementById("btn-upload").addEventListener("click", uploadImage);
        document.getElementById("btn-list").addEventListener("click", loadTags);
        document.getElementById("btn-show").addEventListener("click", showImage);

        // Carrega lista ao abrir a página
        loadTags();
    </script>
</body>
</html>
